# R CMD check on Linux, Windows and macOS.
#
# Uses r-lib/actions, the standard actions for R packages. The NEPEM-UFSC
# organization must allow them: Settings > Actions > General > Policies >
# "Allow specified actions" > add `r-lib/actions/*`.
on:
  push:
    branches: [master, machine_vision]
  pull_request:
    branches: [master]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Many optional (Suggests) packages are heavy; do not require all of them.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # libpng and FFTW3 are linked by src/Makevars (see SystemRequirements).
      # On Linux, setup-r-dependencies installs them from SystemRequirements;
      # on Windows they ship with Rtools.
      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install fftw libpng
          BREW=$(brew --prefix)
          mkdir -p ~/.R
          {
            echo "CPPFLAGS += -I${BREW}/include"
            echo "LDFLAGS += -L${BREW}/lib"
          } >> ~/.R/Makevars

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
