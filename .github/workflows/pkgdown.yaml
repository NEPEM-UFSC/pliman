# Build the pkgdown site and deploy it to GitHub Pages.
# Requires: Settings > Pages > Build and deployment > Source = "GitHub Actions".
#
# Only GitHub-created actions (actions/*) are used, because the NEPEM-UFSC
# organization does not allow third-party actions such as r-lib/actions.
# R, pandoc and the package dependencies are installed with plain shell steps.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_LIBS_USER: ${{ github.workspace }}/.r-lib
      _R_CHECK_FORCE_SUGGESTS_: false
      # let pak install the system libraries of the R packages (magick, av, rgl, ...)
      PKG_SYSREQS: true
    steps:
      - uses: actions/checkout@v4

      - name: Install R, pandoc and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common dirmngr wget
          wget -qO- https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc \
            | sudo tee /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc > /dev/null
          sudo add-apt-repository -y "deb https://cloud.r-project.org/bin/linux/ubuntu $(lsb_release -cs)-cran40/"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base r-base-dev pandoc \
            libpng-dev libfftw3-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev libtiff5-dev libjpeg-dev libwebp-dev
          R --version
          pandoc --version | head -1

      - name: Configure R (Posit Package Manager binaries)
        run: |
          mkdir -p "$R_LIBS_USER"
          cat >> ~/.Rprofile <<EOF
          options(
            repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/$(lsb_release -cs)/latest"),
            HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
              paste(getRversion(), R.version\$platform, R.version\$arch, R.version\$os)),
            Ncpus = 4
          )
          EOF
          echo "R_VERSION=$(Rscript -e 'cat(as.character(getRversion()))')" >> "$GITHUB_ENV"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ env.R_VERSION }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: r-${{ runner.os }}-${{ env.R_VERSION }}-

      - name: Install package dependencies
        run: |
          install.packages("pak")
          # Suggests + packages used only by the articles (Config/Needs/website)
          pak::pkg_install(c("pkgdown", "deps::."), dependencies = c("all", "Config/Needs/website"), upgrade = FALSE)
          pak::local_install(dependencies = FALSE, upgrade = FALSE)
        shell: Rscript {0}

      - name: Build site
        # On failure, the full error (including the "Caused by" chain) is also
        # reported as a workflow annotation, visible in the run summary.
        run: |
          tryCatch(
            pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE),
            error = function(e) {
              txt <- tryCatch(paste(format(e, backtrace = FALSE), collapse = "\n"),
                              error = function(e2) conditionMessage(e))
              txt <- gsub("\n", "%0A", gsub("\r", "%0D", gsub("%", "%25", txt, fixed = TRUE), fixed = TRUE), fixed = TRUE)
              cat("::error title=pkgdown build failed::", txt, "\n", sep = "")
              print(e)
              quit(status = 1)
            }
          )
        shell: Rscript {0}

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
