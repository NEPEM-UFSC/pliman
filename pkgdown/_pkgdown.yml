url: https://nepem-ufsc.github.io/pliman/

home:
  title: pliman
  description: Tools for Plant Image Analysis

template:
  bootstrap: 5
  bootswatch: minty
  light-switch: true
  theme-dark: gruvbox-dark
  bslib:
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: "#A6081A"

toc:
  depth: 3

authors:
  Tiago Olivoto:
    href: https://olivoto.netlify.app/

